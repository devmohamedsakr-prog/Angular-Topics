name: Automated Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Automated Tagging"]
    types: [completed]
    branches: [main]

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.LATEST_TAG }}
          release_name: Angular Topics ${{ steps.tag.outputs.LATEST_TAG }}
          body: "Angular Topics Release - Production Ready. Repository: https://github.com/devmohamedsakr-prog/Angular-Topics. Content: 27272+ lines, 250+ code examples, 150+ interview questions, 9 system modules."
          draft: false
          prerelease: false
