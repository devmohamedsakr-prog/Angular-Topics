name: Automated Release

on:
  push:
    tags:
      - 'v*'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    name: Prepare Release Artifacts
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Release Version: $VERSION"
      
      - name: Generate changelog
        id: changelog
        run: |
          echo "Generating changelog..."
          
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="$CURRENT_TAG" 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "This is the initial release"
            CHANGELOG="Initial Release

Features:
- Comprehensive Angular learning resource
- 14 core topics with examples
- 150+ interview questions
- Real-world system implementations
- Advanced guides and best practices"
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..$CURRENT_TAG --pretty=format:"- %s" | sed 's/^/  /')
          fi
          
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  create-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs: prepare-release
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Angular Topics v${{ needs.prepare-release.outputs.VERSION }}
          body: |
            Version: ${{ needs.prepare-release.outputs.VERSION }}
            
            ## What's Included
            - 14 core Angular topics
            - 150+ interview questions with answers
            - 2 real-world system implementations
            - 5 system design scenarios
            - 10 architecture decision records
            - 8 code challenges with solutions
            - 3 mock interview scripts
            - 7 advanced guides
            
            ## Content Statistics
            - Total Lines: 27,272+
            - Code Examples: 250+
            - Interview Q&A: 150+
            - System Modules: 9
            - Production Ready: Yes
            
            ## Changes Since Previous Release
            ${{ needs.prepare-release.outputs.CHANGELOG }}
            
            ## Resources
            - Repository: https://github.com/devmohamedsakr-prog/Angular-Topics
            - Documentation: See README.md
            - Contributing: See CONTRIBUTING.md
            
            ---
            
            **Release Date:** $(date -u +'%Y-%m-%d')
            **Status:** Production Ready
          draft: false
          prerelease: false

  publish-release:
    runs-on: ubuntu-latest
    name: Publish Release Metadata
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Log release info
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          
          echo "Release Published Successfully"
          echo ""
          echo "Version: $VERSION"
          echo "Repository: https://github.com/devmohamedsakr-prog/Angular-Topics"
          echo "Release URL: https://github.com/devmohamedsakr-prog/Angular-Topics/releases/tag/${{ github.ref_name }}"
          echo ""
          echo "Content Summary:"
          echo "- 27,272+ lines of documentation"
          echo "- 250+ code examples"
          echo "- 150+ interview questions"
          echo "- 9 system modules"
          echo "- 0% duplicate content"
          echo ""
          echo "Status: Ready for download and usage"

  verify-release:
    runs-on: ubuntu-latest
    name: Verify Release Integrity
    needs: publish-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Verify release content
        run: |
          echo "Verifying release content..."
          
          # Check required directories
          required_dirs=(
            "INTERVIEW-PREP"
            "BONUS-CONTENT"
            "SYSTEMS"
          )
          
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              count=$(find "$dir" -type f | wc -l)
              echo "✓ $dir: $count files"
            else
              echo "✗ $dir: Missing!"
              exit 1
            fi
          done
          
          # Check required files
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
          )
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              size=$(wc -l < "$file")
              echo "✓ $file: $size lines"
            else
              echo "✗ $file: Missing!"
              exit 1
            fi
          done
          
          echo ""
          echo "Release integrity verified successfully"
