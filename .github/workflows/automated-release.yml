name: Automated Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Automated Tagging"]
    types: [completed]
    branches: [main]

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Generate release notes
        id: notes
        run: |
          cat > /tmp/release_notes.md << 'EOF'
          ## Angular Topics Release - Production Ready
          
          ### What's Included
          
          - **14 Core Angular Topics** with comprehensive examples
          - **150+ Interview Questions** with detailed answers
          - **250+ Code Examples** covering real-world scenarios
          - **2 Real-World System Implementations** with architecture
          - **5 System Design Scenarios** with solutions
          - **10 Architecture Decision Records** (ADRs)
          - **8 Code Challenges** with full solutions
          - **3 Mock Interview Scripts** for practice
          - **7 Advanced Guides** and best practices
          
          ### Content Statistics
          
          - **Total Lines**: 27,272+
          - **Markdown Files**: 100+
          - **Code Examples**: 250+
          - **Interview Q&A**: 150+
          - **System Modules**: 9
          - **Coverage**: Enterprise-ready
          - **Status**: Production Ready
          
          ### Topics Covered
          
          ✓ Fundamentals and Basics  
          ✓ Services and Dependency Injection  
          ✓ RxJS and Observables  
          ✓ Routing and Navigation  
          ✓ Forms (Reactive & Template-driven)  
          ✓ HTTP and Backend Communication  
          ✓ State Management (NgRx)  
          ✓ Advanced Patterns and Optimization  
          ✓ Security Best Practices  
          ✓ Deployment and Build  
          ✓ Testing Strategies  
          ✓ GitHub Collaboration  
          ✓ Code Organization  
          
          ### Key Features
          
          - **Professional Documentation**: Well-organized, easy-to-follow guides
          - **Code Examples**: Production-ready code samples
          - **Interview Prep**: Comprehensive Q&A for technical interviews
          - **System Design**: Real-world architecture examples
          - **Best Practices**: Enterprise-level standards
          - **Learning Path**: Structured progression from basics to advanced
          
          ### Installation
          
          ```bash
          # Clone the repository
          git clone https://github.com/devmohamedsakr-prog/Angular-Topics.git
          
          # Navigate to directory
          cd Angular-Topics
          
          # Start learning!
          # Begin with README.md for overview
          ```
          
          ### Resources
          
          - **Repository**: https://github.com/devmohamedsakr-prog/Angular-Topics
          - **Documentation**: See README.md
          - **Contributing**: See CONTRIBUTING.md
          - **Security**: See SECURITY.md
          - **Changelog**: See CHANGELOG.md
          - **Releases**: See RELEASES.md
          
          ### Learning Path
          
          1. Start with Fundamentals (Topic 1)
          2. Progress through Angular Basics
          3. Master Services and DI
          4. Learn RxJS and Observables
          5. Master Routing and Forms
          6. Understand HTTP Communication
          7. State Management with NgRx
          8. Advanced Patterns and Optimization
          9. Security Best Practices
          10. Deployment and Build
          11. Testing Strategies
          12. Interview Preparation
          
          ### Support & Contributing
          
          - Issues: GitHub Issues
          - Contributing: CONTRIBUTING.md
          - Security: SECURITY.md
          - Code of Conduct: CODE_OF_CONDUCT.md
          
          ### License
          
          MIT License - See LICENSE file
          
          ---
          
          **Repository**: https://github.com/devmohamedsakr-prog/Angular-Topics  
          **Release Date**: $(date -u +'%Y-%m-%d')  
          **Status**: Production Ready  
          **Quality**: Enterprise-level
          EOF
          
          echo "Release notes generated"

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.LATEST_TAG }}" &>/dev/null; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Release already exists"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Release does not exist"
          fi

      - name: Create release
        if: steps.check.outputs.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.LATEST_TAG }}" \
            --title "Angular Topics ${{ steps.tag.outputs.LATEST_TAG }}" \
            --notes-file /tmp/release_notes.md \
            --draft=false \
            --prerelease=false

      - name: Release status
        run: |
          if [ "${{ steps.check.outputs.EXISTS }}" = "true" ]; then
            echo "Release Status: Already exists (skipped creation)"
          else
            echo "Release Status: Created successfully with professional notes"
          fi
