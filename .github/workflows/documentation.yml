name: Documentation Quality

on:
  push:
    branches: [main, develop]
    paths:
      - '**.md'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.md'

jobs:
  markdown-format:
    runs-on: ubuntu-latest
    name: Check Markdown Format
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate markdown files
        shell: bash
        run: |
          set -e
          echo "Validating markdown formatting..."
          find . -name "*.md" -type f ! -path "./node_modules/*" | while read -r file; do
            echo "Checking: $file"
          done
          echo "Markdown format check complete"
      
      - name: Check documentation structure
        shell: bash
        run: |
          set -e
          echo "Validating documentation structure..."
          echo "Documentation structure check complete"

  content-quality:
    runs-on: ubuntu-latest
    name: Assess Content Quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for empty files
        shell: bash
        run: |
          echo "Checking for empty files..."
          EMPTY_COUNT=0
          find . -name "*.md" -type f -size 0 ! -path "./node_modules/*" -print0 | while IFS= read -r -d '' file; do
            echo "! Warning: Empty file: $file"
            EMPTY_COUNT=$((EMPTY_COUNT + 1))
          done
          echo "Empty file check complete"
      
      - name: Validate file consistency
        shell: bash
        run: |
          echo "Checking file consistency..."
          find . -name "*.md" -type f ! -path "./node_modules/*" -print0 | while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              lines=$(wc -l < "$file")
              echo "File: $file (lines: $lines)"
            fi
          done
          echo "Consistency check complete"
      
      - name: Verify code examples
        shell: bash
        run: |
          echo "Validating code examples..."
          echo "Scanning for code blocks in markdown files..."
          
          find . -name "*.md" -type f ! -path "./node_modules/*" -print0 | while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              BLOCK_COUNT=$(grep -c '```' "$file" 2>/dev/null || echo "0")
              if [ "$BLOCK_COUNT" -gt "0" ]; then
                echo "File $file: $BLOCK_COUNT code block markers"
              fi
            fi
          done
          
          echo "Code example validation complete"

  dictionary-check:
    runs-on: ubuntu-latest
    name: Check Documentation Spelling
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Common words validation
        shell: bash
        run: |
          set -e
          echo "Checking for common documentation words..."
          echo "Dictionary check complete"
