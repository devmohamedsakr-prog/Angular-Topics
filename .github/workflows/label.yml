# This workflow automatically labels pull requests based on the paths of files changed.
# Configuration is in .github/labeler.yml
# For more information, see: https://github.com/actions/labeler

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    name: Auto-label PR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-label PR based on file changes
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
