name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
      
      - name: Extract changelog
        id: changelog
        run: |
          echo "Generating release notes..."
          
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude="$GITHUB_REF_NAME" 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            echo "CHANGELOG=Initial release" >> $GITHUB_OUTPUT
          else
            COMMITS=$(git log $LAST_TAG..$GITHUB_REF --pretty=format:"- %s")
            echo "CHANGELOG=$COMMITS" >> $GITHUB_OUTPUT
          fi
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            Version: ${{ steps.version.outputs.VERSION }}
            
            ## What's New
            - Angular Topics Learning Resource
            - Production-ready content
            - 27,272+ lines of documentation
            - 150+ interview questions
            - Real-world system implementations
            
            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false

  tag-workflow:
    runs-on: ubuntu-latest
    name: Manage Tags
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: List tags
        run: |
          echo "Current tags:"
          git tag -l
          
          echo ""
          echo "Latest tag:"
          git describe --tags --abbrev=0 2>/dev/null || echo "No tags found"
      
      - name: Verify tag format
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          
          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag format is valid: $TAG"
          else
            echo "Invalid tag format: $TAG"
            echo "Expected format: v1.0.0"
            exit 1
          fi
