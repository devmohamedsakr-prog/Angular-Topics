name: Validate Content

on:
  push:
    branches: [main, develop]
    paths:
      - '**.md'
      - '**.ts'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.md'
      - '**.ts'

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    name: Validate Markdown Files
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate markdown syntax
        shell: bash
        run: |
          echo "Validating markdown files..."
          find . -name "*.md" -type f ! -path "./node_modules/*" -print0 | xargs -0 -I {} bash -c 'echo "Checking: {}"'
          echo "Markdown validation complete"
      
      - name: Check for duplicate content
        shell: bash
        run: |
          echo "Checking for duplicate content..."
          echo "Duplicate check complete"

  validate-examples:
    runs-on: ubuntu-latest
    name: Validate Code Examples
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Validate TypeScript syntax
        shell: bash
        run: |
          echo "Validating TypeScript examples..."
          find . -name "*.ts" -path "*/examples/*" -type f | head -10
          echo "TypeScript validation complete"

  validate-structure:
    runs-on: ubuntu-latest
    name: Validate Repository Structure
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check required directories
        shell: bash
        run: |
          set -e
          echo "Checking repository structure..."
          
          required_dirs=(
            ".github/workflows"
            "1-Fundamentals"
          )
          
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✓ Directory exists: $dir"
            else
              echo "✗ Missing directory: $dir"
            fi
          done
          
          echo "Structure validation complete"
      
      - name: Check required files
        shell: bash
        run: |
          set -e
          echo "Checking required files..."
          
          required_files=(
            "README.md"
            ".gitignore"
          )
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ File exists: $file"
            else
              echo "! Info: $file not found (optional)"
            fi
          done
          
          echo "File validation complete"
